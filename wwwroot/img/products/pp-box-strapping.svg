  <path d="M124 168h16v14h-16z" fill="#22262B"/>
  <g stroke="#B30F15" stroke-width="1" opacity=".6">
    <path d="M129 140h6M129 148h6M129 156h6M129 192h6M129 200h6M129 208h6M129 216h6M129 224h6"/>
